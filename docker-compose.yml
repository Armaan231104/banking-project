version: '3.9'
services:
  api:
    build: .
    ports:
      - '8000:8000'
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: banking
      POSTGRES_USER: banking
      POSTGRES_PASSWORD: banking
    ports:
      - '5432:5432'
  redis:
    image: redis:7
    ports:
      - '6379:6379'
